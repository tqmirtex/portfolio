<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — tqmirtex.com</title>
  <meta name="description" content="山本拓実へのお問い合わせ">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="../">tqmirtex.com</a>
      <button class="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="../">Top</a>
        <a href="../works/">Works</a>
        <a href="../blog/">Blog</a>
        <a href="../contact/" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="orbs" aria-hidden="true">
        <span class="orb orb--rose"></span>
        <span class="orb orb--mint"></span>
      </div>
      <div class="container">
        <h1 class="page-head__title reveal">Contact</h1>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <form class="contact-form" data-contact-form novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <p class="field__error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <p class="field__error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>
            <p class="field__error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="8" required></textarea>
            <p class="field__error" aria-live="polite"></p>
          </div>
          <div class="contact-form__foot">
            <button class="btn btn--primary" type="submit">メールを作成する</button>
            <p class="contact-form__note">送信するとメールアプリが開き、<a href="mailto:contact@tqmirtex.com">contact@tqmirtex.com</a> 宛のメールが作成されます。</p>
          </div>
          <p class="contact-form__status" data-form-status aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-logo" href="../">tqmirtex.com</a>
      <ul class="site-footer__links">
        <li><a href="https://x.com/tqmirtex" target="_blank" rel="noopener">X</a></li>
        <li><a href="https://github.com/tqmirtex" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <p class="site-footer__copy">&copy; <span data-year></span> tqmirtex</p>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
