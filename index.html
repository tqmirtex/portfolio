<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tqmirtex.com</title>
  <meta name="description" content="tqmirtex（山本拓実）のポートフォリオ">
  <meta property="og:title" content="tqmirtex.com">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="./">tqmirtex.com</a>
      <button class="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="./" aria-current="page">Top</a>
        <a href="works/">Works</a>
        <a href="blog/">Blog</a>
        <a href="contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="orbs" aria-hidden="true">
        <span class="orb orb--mint"></span>
        <span class="orb orb--peach"></span>
        <span class="orb orb--lavender"></span>
      </div>
      <div class="container hero__inner">
        <img class="hero__avatar" src="assets/images/avatar.png" alt="山本拓実のイラスト" width="260" height="244">
        <h1 class="hero__title reveal">Takumi Yamamoto</h1>

        <dl class="profile reveal">
          <div class="profile__row">
            <dt>Name</dt>
            <dd>山本拓実</dd>
          </div>
          <div class="profile__row">
            <dt>Handle</dt>
            <dd>tqmirtex</dd>
          </div>
          <div class="profile__row">
            <dt>Age</dt>
            <dd>19歳</dd>
          </div>
          <div class="profile__row">
            <dt>Affiliation</dt>
            <dd>九州大学 電気情報工学科</dd>
          </div>
          <div class="profile__row">
            <dt>Location</dt>
            <dd>福岡</dd>
          </div>
        </dl>

        <ul class="social reveal">
          <li><a class="btn btn--outline" href="https://x.com/tqmirtex" target="_blank" rel="noopener">X</a></li>
          <li><a class="btn btn--outline" href="https://github.com/tqmirtex" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">Works</h2>
          <a class="link-more" href="works/">すべて見る <span aria-hidden="true">→</span></a>
        </div>
        <div class="card-grid" data-works-list data-limit="3"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">Blog</h2>
          <a class="link-more" href="blog/">すべて見る <span aria-hidden="true">→</span></a>
        </div>
        <ul class="post-list" data-blog-list data-limit="5"></ul>
      </div>
    </section>

    <section class="section section--cta">
      <div class="container">
        <div class="cta-card">
          <div class="orbs" aria-hidden="true">
            <span class="orb orb--sky"></span>
            <span class="orb orb--rose"></span>
          </div>
          <h2 class="cta-card__title">Contact</h2>
          <p class="cta-card__text">お問い合わせはフォームからお気軽にどうぞ。</p>
          <a class="btn btn--primary" href="contact/">お問い合わせフォームへ</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-logo" href="./">tqmirtex.com</a>
      <ul class="site-footer__links">
        <li><a href="https://x.com/tqmirtex" target="_blank" rel="noopener">X</a></li>
        <li><a href="https://github.com/tqmirtex" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <p class="site-footer__copy">&copy; <span data-year></span> tqmirtex</p>
    </div>
  </footer>

  <script src="assets/js/data/works.js"></script>
  <script src="assets/js/data/blog.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
