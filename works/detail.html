<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — tqmirtex.com</title>
  <meta name="description" content="実績の詳細">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="../">tqmirtex.com</a>
      <button class="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="../">Top</a>
        <a href="../works/" aria-current="page">Works</a>
        <a href="../blog/">Blog</a>
        <a href="../contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="work-detail" data-work-detail>
      <div class="orbs" aria-hidden="true">
        <span class="orb orb--peach"></span>
        <span class="orb orb--sky"></span>
      </div>
      <div class="container container--narrow">
        <a class="link-back" href="./"><span aria-hidden="true">←</span> 実績一覧</a>
        <header class="work-detail__head">
          <p class="work-detail__meta"><time data-field="date"></time><span class="dot" aria-hidden="true"></span><span data-field="type"></span></p>
          <h1 class="work-detail__title" data-field="title"></h1>
          <ul class="tags" data-field="stack"></ul>
        </header>
        <figure class="work-detail__thumb"><img data-field="thumbnail" alt=""></figure>
        <div class="prose" data-field="body"></div>
        <nav class="work-detail__nav" data-field="nav" aria-label="前後の実績"></nav>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-logo" href="../">tqmirtex.com</a>
      <ul class="site-footer__links">
        <li><a href="https://x.com/tqmirtex" target="_blank" rel="noopener">X</a></li>
        <li><a href="https://github.com/tqmirtex" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <p class="site-footer__copy">&copy; <span data-year></span> tqmirtex</p>
    </div>
  </footer>

  <script src="../assets/js/data/works.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
